[package]
name = "compiler"
version = "0.1.0"
edition = "2024"

[features]
default = []
dissect = []

[dependencies]
rustc-hash = "2"
common = { path = "../common" }
parser = { path = "../parser" }
reporting = { path = "../reporting" }
rkyv = "0.8.12"
serde = { version = "1", features = ["derive"] }
stacker = "0.1.25"
sha2 = "0.10"

[dev-dependencies]
machine = { path = "../machine", default-features = false }
# Integration tests run programs on the MIR interpreter, and user and
# built-in derive macros at compile time. These crates depend on `compiler`.
coil-host = { path = "../coil-host" }
coil-mir-interp = { path = "../coil-mir-interp" }
comptime = { path = "../comptime" }
proptest = "1"
libc = "0.2"
serde_json = "1"

[[test]]
name = "dissect"
required-features = ["dissect"]

