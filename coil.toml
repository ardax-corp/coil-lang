# Project manifest for the coil workspace / examples.
# `[module] roots` is read by spool and the docs, not by the `coil` CLI: pass
# roots explicitly, e.g. `coil --root ../coil-stdlib/src --root examples/src
# examples/modules.hy`. Userland stdlib is
# [coil-stdlib](https://github.com/ardax-corp/coil-stdlib): clone it as a
# sibling (`../coil-stdlib`) or under `.deps/coil-stdlib`.

[module]
roots = ["./src", "./examples/src", "./.deps/coil-stdlib/src", "../coil-stdlib/src"]

[ffi]
search_paths = ["./examples"]
allow = ["sum"]

# The FFI examples' library (examples/sum.c, built locally): trusted so the
# `dload` gate needs no lock hash for it. See examples/ffi_extern.hy.
[dependencies]
sum = { path = "./examples", trusted = true }
