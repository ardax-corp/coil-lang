[package]
name = "coil-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
coil-build-id = { path = "../coil-build-id" }
common = { path = "../common" }
machine = { path = "../machine", default-features = false }
rkyv = "0.8.12"

[features]
default = []
# The bytecode VM for archives native code does not cover (`machine/vm`);
# off in `coil-rt`, whose executables run on the native driver alone.
vm = ["machine/vm"]
