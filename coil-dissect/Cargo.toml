[package]
name = "coil-dissect"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "coil-dissect"
path = "src/main.rs"

[dependencies]
comptime = { path = "../comptime" }
common = { path = "../common" }
parser = { path = "../parser" }
compiler = { path = "../compiler", default-features = false, features = ["dissect"] }
reporting = { path = "../reporting" }
coil-cli = { path = "../coil-cli", default-features = false }
coil-args = { path = "../coil-args" }
clap = { version = "4.5", features = ["derive"] }

[features]
default = []
