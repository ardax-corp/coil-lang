[package]
name = "machine"
version = "0.1.0"
edition = "2024"

[features]
default = []
# `debugger` / `coverage` gate the hook state and APIs only. The dispatch
# loop picks its hooked instantiation (`execute::<true>`) only while a
# controller / collector is attached, so workspace feature unification adds
# no per-instruction cost to `coil` (#558).
debugger = []
# Per-instruction hit counts for `coil-test --coverage`.
coverage = []
vm_profile = []
# Collect at every allocation safepoint (GC soundness testing only).
gc-stress = []
# Print GC census numbers after each mark (docs/internals/gc-evacuation.md).
gc-stats = []

[dependencies]
common = { path = "../common" }
coil-simd = { path = "../coil-simd" }
crossbeam-deque = "0.8"
rkyv = "0.8.12"
libloading = "0.9"
libffi = "5.1.1"
libc = "0.2"
sha2 = "0.10"
parking_lot = "0.12"

[dev-dependencies]
libc = "0.2"
