[package]
name = "machine"
version = "0.1.0"
edition = "2024"

[features]
default = []
debugger = []
vm_profile = []
# Collect at every allocation safepoint (GC soundness testing only).
gc-stress = []
# Print moving-GC feasibility numbers after each mark (docs/internals/moving-gc.md).
gc-stats = []
# Mostly-copying evacuation of sparse chunks (docs/internals/moving-gc.md).
gc-compact = []

[dependencies]
common = { path = "../common" }
coil-simd = { path = "../coil-simd" }
crossbeam-deque = "0.8"
rkyv = "0.8.12"
libloading = "0.9"
libffi = "5.1.1"
libc = "0.2"
sha2 = "0.10"
parking_lot = "0.12"

[dev-dependencies]
libc = "0.2"
