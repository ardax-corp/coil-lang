[package]
name = "machine"
version = "0.1.0"
edition = "2024"

[features]
default = ["time"]
debugger = []
time = ["dep:chrono"]
vm_profile = []

[dependencies]
common = { path = "../common" }
coil-simd = { path = "../coil-simd" }
crossbeam-deque = "0.8"
rkyv = "0.8.12"
libloading = "0.9"
libffi = "5.1.1"
libc = "0.2"
sha2 = "0.10"
chrono = { version = "0.4.45", optional = true }

[dev-dependencies]
libc = "0.2"
