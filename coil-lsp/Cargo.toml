[package]
name = "coil-lsp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "coil-lsp"
path = "src/main.rs"

[dependencies]
comptime = { path = "../comptime" }
compiler = { path = "../compiler", default-features = false }
lsp-server = "0.7"
lsp-types = "0.97"
parser = { path = "../parser" }
reporting = { path = "../reporting" }
serde_json = "1"
coil-args = { path = "../coil-args" }
clap = { version = "4.5", features = ["derive"] }
