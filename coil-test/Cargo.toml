[package]
name = "coil-test"
version = "0.1.0"
edition = "2024"

# `coil test` re-execs this binary. Test-only mechanisms (coverage, step
# budget, …) are enabled here and never in `coil` / `coil-embed`.

[[bin]]
name = "coil-test"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
coil-build-id = { path = "../coil-build-id" }
common = { path = "../common" }
parser = { path = "../parser" }
compiler = { path = "../compiler", default-features = false }
machine = { path = "../machine", default-features = false }
reporting = { path = "../reporting" }
coil-host = { path = "../coil-host" }
coil-args = { path = "../coil-args" }
comptime = { path = "../comptime" }
coil-native = { path = "../coil-native" }
coil-mir-interp = { path = "../coil-mir-interp" }
clap = { version = "4.5", features = ["derive"] }

[features]
default = []
# Collect at every allocation safepoint (GC soundness testing only).
gc-stress = ["machine/gc-stress"]
# Print GC census numbers after each mark.
gc-stats = ["machine/gc-stats"]
