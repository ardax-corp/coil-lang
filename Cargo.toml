[workspace]
resolver = "3"
members = [
    "common",
    "compiler",
    "machine",
    "parser",
    "reporting",
    "coil-cli",
    "coil-embed",
    "coil-debug",
    "coil-dissect",
    "coil-fmt",
    "coil-lsp",
    "coil-simd",
]
# Plain `cargo build` / `cargo test` at the repo root builds all CLI binaries
# (coil + helpers), not only the root package.
default-members = [".", "coil-embed", "coil-debug", "coil-dissect", "coil-fmt", "coil-lsp"]

[package]
name = "coil"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "common" }
machine = { path = "machine", default-features = false }
parser = { path = "parser" }
compiler = { path = "compiler", default-features = false }
reporting = { path = "reporting" }
coil-cli = { path = "coil-cli", default-features = false }
clap = { version = "4.5", features = ["derive"] }
rkyv = "0.8.12"

[dev-dependencies]
criterion = { version = "^0.8", features = ["html_reports"] }

[[bench]]
name = "fib"
harness = false

[features]
default = ["time"]
time = ["machine/time", "compiler/time", "coil-cli/time"]

[profile.release]
opt-level=3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
# debug = 1

[profile.branch_misses]
inherits="release"
debug = 2
