name: CI

# Two stages. Linux runs first, on every push to a pull request (drafts
# included) and on main. Windows and macOS start only once every Linux job
# is green, and on a pull request only once it is ready for review: a change
# that breaks Linux almost always breaks the other two as well, and their
# runners are the slow, scarce ones. Marking a draft ready for review
# (`ready_for_review`) starts a full run.
#
#   stage 1 (Linux):  clippy, fmt, test, test corpus, test-release, harness
#                     builds and cells, wasm  ->  `linux-ok`
#   stage 2:          Windows (clippy, test, test corpus, harness) and macOS
#                     (test with the corpus tests, harness builds and cells)
#   `ci-ok`:          the one check branch protection requires: Linux and
#                     Windows green (Windows skipped is fine on a draft).
#                     macOS stays out of it: its runners are capped and can
#                     queue for a long time, and a PR may merge with macOS
#                     still queued (a macOS job that failed still needs a
#                     look).
#
# Every job sets its own `timeout-minutes`; a job's limit covers that job
# only, so splitting slow platforms into several jobs gives each part its
# own budget.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to a pull request cancels that PR's older runs, so stale runs
# don't fill the runner queue. Pushes to main share one group: the running
# main run always finishes, and a newer push replaces any main run still
# pending, so a burst of merges queues one run, not one per commit. edge.yml
# builds from the newest green main run. cancel-closed-pr.yml joins the PR
# group (`CI-<number>`) to cancel a closed PR's runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CI: "true"
  # The two corpus-wide tests, which compile or format every `.coil` file
  # and take about half of the workspace suite's run time. They run in their
  # own `test corpus` job beside `test`, and `test` skips them. Renaming
  # either test only makes it run in both jobs.
  CORPUS_TESTS_SKIP: >-
    --skip positive_corpus_builds_hir_without_problems
    --skip fmt_is_idempotent_and_keeps_the_ast_on_the_corpus

# Prefer `--lib --tests --bins` over `--all-targets`: Criterion benches under
# `[[bench]]` treat argv after `--` as their own CLI and abort the suite.

jobs:
  # ───────────────────────────── stage 1: Linux ─────────────────────────────

  # Every crate's default feature set is empty, and `coil-debug` /
  # `coil-dissect` already turn on `compiler/dissect` for the whole
  # workspace, so one feature set covers `--no-default-features` /
  # `--features dissect` too.
  # Criterion benches stay out (`--lib --tests --bins`).
  clippy:
    name: clippy (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev build-essential

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: clippy

      - name: Clippy
        run: cargo clippy --workspace --lib --tests --bins -- -D warnings


  # `.coil` sources must be `coil fmt`-clean. `compile_fail/` directories hold
  # deliberately broken programs; `coil fmt` skips them when walking. The embedded prelude
  # (`compiler/src/prelude`) and the comptime fixtures are. A `compile_fail/` test is
  # checked too unless it expects a parse error (E0001, or E0208 for a duplicate field),
  # which `coil fmt` cannot parse either.
  fmt:
    name: coil fmt --check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev build-essential

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: fmt

      - name: coil fmt --check
        run: |
          cargo build -p coil-fmt
          ./target/debug/coil-fmt --check examples tests compiler/src/prelude comptime/tests
          # `grep -L` exits 1 when it lists nothing; only coil-fmt's status counts.
          # E0001 and E0208 files are not valid source; E0125 ones nest past what the parser takes, so coil-fmt cannot read them either.
          find tests -path '*/compile_fail/*.coil' -print0 \
            | { xargs -0 grep -LZE '^// @expected .*E0(001|125|208)\b' || true; } \
            | xargs -0 ./target/debug/coil-fmt --check
          # Empty once every known-wrong cell is fixed, and git keeps no empty dirs.
          if [ -d scripts/rep_matrix_known_wrong ]; then
            ./target/debug/coil-fmt --check scripts/rep_matrix_known_wrong
          fi

      # `tests/representation/` is generated; a hand edit or a generator
      # change without regenerating fails here.
      - name: Representation matrix up to date
        run: python3 scripts/gen_rep_matrix.py --check


  # The workspace suite minus the two corpus-wide tests (`test corpus`).
  # Linux here; macOS runs the same steps in stage 2 (`test-macos`), with
  # the corpus-wide tests included.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps: &test-steps
      - uses: actions/checkout@v4

      # A PR pairs with the coil-stdlib branch of the same name when one
      # exists (a feature branch that changes both); otherwise the default.
      - &pick-stdlib
        name: Pick the coil-stdlib branch
        id: stdlib
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          ref=""
          if [ -n "$HEAD_REF" ] && git ls-remote --exit-code --heads \
              https://github.com/ardax-corp/coil-stdlib "$HEAD_REF" >/dev/null; then
            ref="$HEAD_REF"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - &checkout-stdlib
        uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-stdlib
          path: .deps/coil-stdlib
          ref: ${{ steps.stdlib.outputs.ref }}

      - &deps-ubuntu
        name: Install system deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev build-essential z3

      - &deps-macos
        name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libffi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # `test corpus` restores this cache too; only this job saves it.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      - name: Build all CLI binaries
        run: cargo build

      - name: Workspace tests
        run: |
          set -euo pipefail
          # macOS: the default nofile limit (256) is low for parallel test runs.
          if [ "${{ runner.os }}" = "macOS" ]; then
            ulimit -n 65536 || true
          fi
          # macOS keeps the corpus-wide tests in this job: a second macOS
          # job would only queue for another of the capped runners.
          skip="$CORPUS_TESTS_SKIP"
          if [ "${{ runner.os }}" = "macOS" ]; then
            skip=""
          fi
          # A FAILED summary with exit 0 must still fail the job.
          log="$(mktemp)"
          set +e
          # shellcheck disable=SC2086 # a word list
          cargo test --workspace --lib --tests --bins --no-fail-fast -- $skip 2>&1 | tee "$log"
          code="${PIPESTATUS[0]}"
          set -e
          if grep -E -q 'test result: FAILED|error: test failed' "$log" && [ "$code" -eq 0 ]; then
            echo "::error::tests reported failure but cargo exited 0" >&2
            exit 1
          fi
          exit "$code"

      - name: Showcase project tests
        run: |
          BIN=./target/debug/coil ./examples/projects/run-tests.sh


  # The two corpus-wide tests `test` skips: HIR for every positive `.coil`
  # program, and the `coil fmt` round trip over the corpus. Each already
  # spreads its files over every core.
  test-corpus:
    name: test corpus (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps: &test-corpus-steps
      - uses: actions/checkout@v4
      - *pick-stdlib
      - *checkout-stdlib
      - *deps-ubuntu
      - *deps-macos

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: false

      - name: HIR over the corpus
        run: cargo test -p compiler --test hir_corpus

      - name: coil fmt round trip over the corpus
        run: cargo test -p parser --test fmt_round_trip


  # Release-profile checks: Linux only, beside `test` instead of after its
  # workspace suite.
  test-release:
    name: test (release checks)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - *pick-stdlib
      - *checkout-stdlib

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev build-essential

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: test-release

      - name: Release compiler lib tests build (#1455)
        run: |
          # Lib tests must compile without debug_assertions; build only.
          CARGO_PROFILE_RELEASE_LTO=off CARGO_PROFILE_RELEASE_CODEGEN_UNITS=8 \
          CARGO_PROFILE_RELEASE_PANIC=unwind \
            cargo test --release -p compiler --lib --no-run

      - name: Release machine lib tests (#1686)
        run: |
          # Same profile as the step above, without debug_assertions.
          CARGO_PROFILE_RELEASE_LTO=off CARGO_PROFILE_RELEASE_CODEGEN_UNITS=8 \
          CARGO_PROFILE_RELEASE_PANIC=unwind \
            cargo test --release -p machine --lib

  # The `.coil` harness binaries, built once per OS and build: `debug` and
  # `release` (the same corpus must pass in both, so a build-mode difference
  # such as an optimizer or overflow-check bug shows up) and `gc-stress`, the
  # release `coil-test` that collects at every allocation. Each build is
  # cached by rust-cache, and every `harness` cell downloads one instead of
  # building its own.
  #
  # On Linux each build is its own job and each group of cells waits only
  # for its own build (a `needs:` on a matrix job waits for every cell), so
  # the debug cells start after the short debug build instead of after the
  # release and GC-stress builds. macOS runs the same steps in stage 2.
  harness-build-debug:
    name: harness build (${{ matrix.mode }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        os: [ubuntu-latest]
        mode: [debug]
    steps: &harness-build-steps
      - uses: actions/checkout@v4

      - name: Install system deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev build-essential

      - *deps-macos

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: harness-build-${{ matrix.mode }}
          cache-directories: ${{ matrix.mode == 'gc-stress' && 'target/gc-stress' || '' }}

      - name: Build coil and coil-test
        if: matrix.mode != 'gc-stress'
        run: cargo build ${{ matrix.mode == 'release' && '--release' || '' }} --bin coil --bin coil-test

      # The runtime `coil package` links native executables with: the
      # native cell packages one for the inventory (interpreter symbols).
      - name: Build the native runtime
        if: matrix.mode == 'release'
        run: cargo build --release -p coil-rt

      # `coil test` re-execs `coil-test`; the GC-stress cells run this
      # harness directly. Release only: the debug GC-stress cells are off
      # (#2131).
      - name: Build coil-test with GC stress
        if: matrix.mode == 'gc-stress'
        run: cargo build --release -p coil-test --features gc-stress --target-dir target/gc-stress

      - name: Collect binaries
        run: |
          mkdir -p harness-bin
          if [ "${{ matrix.mode }}" = gc-stress ]; then
            mkdir -p harness-bin/gc-stress
            cp target/gc-stress/release/coil-test harness-bin/gc-stress/
          else
            cp target/${{ matrix.mode }}/coil target/${{ matrix.mode }}/coil-test harness-bin/
            if [ "${{ matrix.mode }}" = release ]; then
              cp target/release/libcoil_rt.a harness-bin/
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: harness-bin-${{ matrix.os }}-${{ matrix.mode }}
          path: harness-bin
          retention-days: 1

  harness-build-release:
    name: harness build (${{ matrix.mode }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        os: [ubuntu-latest]
        mode: [release]
    steps: *harness-build-steps

  harness-build-gc-stress:
    name: harness build (${{ matrix.mode }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        os: [ubuntu-latest]
        mode: [gc-stress]
    steps: *harness-build-steps


  # The `.coil` corpora under each compiler / engine setting and build mode, one
  # cell each so debug and release run side by side.
  # `scripts/test_corpora.py` runs each `tests/<corpus>` as its own process,
  # in parallel. A GC-stress cell is named `(release, …)` and runs the
  # `gc-stress` build.
  harness-debug:
    name: harness ${{ matrix.variant }} (${{ matrix.mode }}, ${{ matrix.os }})
    needs: harness-build-debug
    runs-on: ${{ matrix.os }}
    # The last resort for a hang: `coil test --wall-timeout` (600 s; 1200 s
    # in the GC-stress cells, see below) ends a run whose case never
    # returns, naming the case and the seed, and
    # `test_corpora.py --timeout` (1800 s) kills a corpus process that
    # wedges outside a case. A job that still reaches this limit is a
    # harness bug; its logs are uploaded all the same (`cancelled()` below).
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        mode: [debug]
        variant: [default, O0, leak-smoke]
    env: &harness-env
      # A worker abort (coil-lang#804) prints where it happened.
      RUST_BACKTRACE: "1"
      FLAGS: --allow-read --allow-write --allow-net --allow-env --root examples/src --root .deps/coil-stdlib/src --root ../coil-stdlib/src
    steps: &harness-steps
      - uses: actions/checkout@v4
      - *pick-stdlib
      - *checkout-stdlib

      - name: Install system deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev

      - *deps-macos

      - uses: actions/download-artifact@v4
        with:
          name: harness-bin-${{ matrix.os }}-${{ matrix.variant == 'gc-stress' && 'gc-stress' || matrix.mode }}
          path: harness-bin

      - name: Language harness (${{ matrix.variant }}, ${{ matrix.mode }})
        run: |
          find harness-bin -type f -exec chmod +x {} +
          run="python3 scripts/test_corpora.py --bin harness-bin"
          case "${{ matrix.variant }}" in
            default) $run -- --engine native $FLAGS ;;
            # Optimizations hide codegen bugs (LICM materializes invariants,
            # inlining drops CALL targets); run the unoptimized pipeline too.
            O0) $run -- --engine native -O 0 $FLAGS ;;
            leak-smoke)
              # Each corpus process gets 256 MiB of address space above the
              # harness's own code, one job and one malloc arena: a thread's
              # own arena reserves 64 MiB of address space, so whether a deep
              # test fits would depend on the order of the files. A leak
              # grows far past this; a million-frame recursion on the
              # interpreter takes about 128 MiB.
              # Parked frames, because a fiber's reserved stack counts as
              # address space with nothing behind it.
              code_kb=$(( $(size -d harness-bin/coil-test | awk 'NR==2 {print $4}') / 1024 ))
              MALLOC_ARENA_MAX=1 COIL_NO_FIBERS=1 $run -j 1 --limit-as-kb $(( code_kb + 262144 )) -- --engine mir $FLAGS ;;
            # Collect and evacuate at every allocation (precise-root soundness).
            # The memory corpus also at -O0: without inlining, a call's
            # result reaches its consumer as a call result instead of a
            # local, so the roots differ from the default level (#1481).
            # Generics too: uninlined calls through `forall` parameters
            # pass dictionaries the default level folds away (#1530).
            # A full cycle per allocation costs time quadratic in what a
            # case keeps live, so a case holds thousands of objects, not
            # hundreds of thousands, and forces the collection it needs
            # with `collect()`. The per-case wall limit is wider than the
            # default 600 s for slow runners.
            gc-stress)
              # On both engines, whose roots are their own: stack maps, and
              # the interpreter's scan.
              $run --harness harness-bin/gc-stress/coil-test -- --engine native --wall-timeout 1200 $FLAGS
              $run --harness harness-bin/gc-stress/coil-test memory generics -- --engine native -O 0 --wall-timeout 1200 $FLAGS
              # Stack maps as a code image carries them.
              COIL_CODE_IMAGE_CHECK=1 $run --harness harness-bin/gc-stress/coil-test memory -- --engine native --wall-timeout 1200 $FLAGS
              $run --harness harness-bin/gc-stress/coil-test -- --engine mir --wall-timeout 1200 $FLAGS
              # And the frames parked on the heap, as on wasm.
              COIL_NO_FIBERS=1 $run --harness harness-bin/gc-stress/coil-test -- --engine mir --wall-timeout 1200 $FLAGS ;;
            # Every corpus on native code (`docs/internals/native.md`). Each
            # run also records the bodies native code refused
            # (`scripts/native_inventory.py`, next step). Every program goes
            # through a code image and runs from the copy, as a code cache
            # hit would: the `default` cells run compiled code as it is.
            native) mkdir -p target && COIL_CODE_IMAGE_CHECK=1 COIL_NATIVE_INVENTORY="$PWD/target/native-inventory.tsv" $run -- --engine native $FLAGS ;;
            # Every corpus on the MIR interpreter: raw MIR at `-O 0`, the
            # reference the optimized engines are compared against
            # (`docs/internals/mir-interp.md`).
            # Every body also goes through the MIR archive format and must
            # come back equal: the run uses the copy.
            mir) COIL_MIR_ARCHIVE_CHECK=1 $run -- --engine mir $FLAGS ;;
            # And each level above it, on the MIR native code compiles: a
            # failure here and not in `mir` is a pass's.
            # With the MIR verifier on after every pass (see `mir-verify`):
            # it costs about 1% and names the pass.
            mir-opt) for level in 1 2 3 s g; do COIL_MIR_VERIFY=1 $run -- --engine mir -O $level --cell mir-verify $FLAGS; done ;;
            # Generators and tasks parked on the heap instead of on fibers:
            # what wasm runs, where a failure is harder to read.
            mir-parked) COIL_NO_FIBERS=1 $run -- --engine mir $FLAGS ;;
            # No per-type clones: every generic call takes its shared body
            # (dictionaries, boxed words), which the default cells reach
            # only past the clone budget. A file's own
            # `// @flags --clone-budget N` still wins. `--cell` names the
            # run for the `// @xfail clone-budget-0 #issue` header lines:
            # those files must fail, and one that passes fails the cell.
            # The MIR verifier (`MirFunc::verify`, `verify_dominance`) on every
            # body as lowered and after each MIR pass, which only debug
            # builds run otherwise: a pass that breaks SSA is a hang or a
            # wrong value in a release build (#2422). A violation panics,
            # naming the pass, the function and the file, and ends that
            # corpus's process, so a file with a filed violation is kept out
            # with `// @skip mir-verify #issue`. `mir-opt` runs the other
            # levels this way.
            mir-verify)
              for engine in native mir; do
                COIL_MIR_VERIFY=1 $run -- --engine $engine --cell mir-verify $FLAGS
              done ;;
            # Every program with a `main` (corpus, examples, perf benches)
            # as its own process with `--auto-par on` and `--auto-par off`,
            # on 8 workers and both engines: stdout, stderr and the exit
            # code must be the same. `// @skip auto-par <why>` keeps out a
            # program whose output depends on time or scheduling, and
            # `// @xfail auto-par #issue` lists a known difference.
            auto-par) python3 scripts/auto_par_diff.py --bin harness-bin -- $FLAGS ;;
            clone-budget-0)
              for engine in native mir; do
                $run -- --engine $engine --clone-budget 0 --cell clone-budget-0 $FLAGS
              done ;;
          esac

      # Native code takes every body, and a packaged program builds.
      - name: Native inventory
        if: matrix.variant == 'native' && always()
        run: |
          mkdir -p target/native-hello
          printf 'use io::sync::println;\nfn main() {\n    let _ = println("hello");\n}\n' > target/native-hello/hello.coil
          COIL_RT_LIB=harness-bin/libcoil_rt.a harness-bin/coil package --root .deps/coil-stdlib/src \
            target/native-hello/hello.coil -o target/native-hello/hello
          ls -l target/native-hello/hello
          python3 scripts/native_inventory.py target/native-inventory.tsv --max refused=0 --max failed=0

      - uses: actions/upload-artifact@v4
        if: matrix.variant == 'native' && always()
        with:
          name: native-inventory
          path: target/native-inventory.tsv
          retention-days: 14

      # The examples in the builtin doc stubs (compiler/src/builtin_docs/)
      # and the embedded modules (compiler/src/prelude/, such as `task`),
      # which no test file imports. `-A`: they show exit and FFI too.
      - name: Builtin doc-tests (${{ matrix.variant }}, ${{ matrix.mode }})
        if: matrix.variant == 'default' || matrix.variant == 'O0'
        run: |
          for docs in compiler/src/builtin_docs compiler/src/prelude; do
            harness-bin/coil test --doc-tests-only -A ${{ matrix.variant == 'O0' && '-O 0' || '' }} \
              --root examples/src --root .deps/coil-stdlib/src "$docs" || exit 1
          done

      - uses: actions/upload-artifact@v4
        # `cancelled()`: a job cut off by `timeout-minutes` still uploads
        # the per-corpus logs (which corpus hung, and the seed).
        if: failure() || cancelled()
        with:
          name: harness-logs-${{ matrix.os }}-${{ matrix.mode }}-${{ matrix.variant }}
          path: target/corpora
          retention-days: 7

  harness-release:
    name: harness ${{ matrix.variant }} (${{ matrix.mode }}, ${{ matrix.os }})
    needs: harness-build-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        mode: [release]
        # Native code runs in release only: a debug cell would test the
        # same Cranelift output at a fraction of the speed.
        variant: [default, O0, leak-smoke, native, mir, mir-opt, mir-parked, mir-verify, clone-budget-0, auto-par]
    env: *harness-env
    steps: *harness-steps

  # GC stress runs in release only. The debug cells took over 30 minutes
  # even split in three and kept timing out on a stall (#2131), so PRs
  # ignored them; restore them once that is fixed.
  harness-gc-stress:
    name: harness ${{ matrix.variant }} (${{ matrix.mode }}, ${{ matrix.os }})
    needs: harness-build-gc-stress
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        mode: [release]
        variant: [gc-stress]
    env: *harness-env
    steps: *harness-steps


  # coil for wasm32-wasip1, the build the website playground runs in the
  # browser: clippy for that target, then every corpus under Node's WASI.
  # Files that need sockets or symlinks say so (`// @needs`) and are skipped.
  wasm:
    name: wasm (wasm32-wasip1)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - *pick-stdlib
      - *checkout-stdlib

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Clippy (wasm32-wasip1)
        run: cargo clippy --target wasm32-wasip1 -p coil -- -D warnings

      - name: Build coil.wasm
        run: cargo build --release --target wasm32-wasip1 -p coil

      # `coil dissect` runs in process on wasm (no coil-dissect to re-exec);
      # the playground's Inspect panel depends on it.
      - name: Dissect (wasm)
        run: |
          mkdir -p target/wasm-dissect
          printf 'fn sq(int x) -> int {\n    return x * x;\n}\n\nfn main() {\n    sq(7);\n}\n' > target/wasm-dissect/main.coil
          node --no-warnings --no-turbo-fast-api-calls scripts/wasi_coil.mjs \
            target/wasm32-wasip1/release/coil.wasm dissect target/wasm-dissect/main.coil \
            -O0 --fn sq --hir --root .deps/coil-stdlib/src > target/wasm-dissect/out.txt
          cat target/wasm-dissect/out.txt
          grep -q '=== hir ===' target/wasm-dissect/out.txt
          grep -q 'imul' target/wasm-dissect/out.txt

      - name: Language harness (wasm)
        run: |
          python3 scripts/test_corpora.py --wasm target/wasm32-wasip1/release/coil.wasm -- \
            --allow-read --allow-write --allow-net --allow-env \
            --root examples/src --root .deps/coil-stdlib/src

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: harness-logs-wasm
          path: target/corpora
          retention-days: 7


  # Every Linux job green. Stage 2 waits on this one job instead of listing
  # all of stage 1 in each `needs:`.
  linux-ok:
    name: linux ok
    if: always()
    needs:
      - clippy
      - fmt
      - test
      - test-corpus
      - test-release
      - harness-build-debug
      - harness-build-release
      - harness-build-gc-stress
      - harness-debug
      - harness-release
      - harness-gc-stress
      - wasm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every Linux job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::Linux jobs not green: $bad"
            exit 1
          fi


  # ──────────────────────── stage 2: Windows and macOS ────────────────────────
  #
  # Each job needs `linux-ok` (it is skipped when Linux fails) and, on a pull
  # request, runs only once the PR is out of draft.

  # `cfg(windows)` host code (machine io / fs / reactor / threads) is only
  # linted here.
  clippy-windows-gnu:
    name: clippy (windows-gnu)
    needs: linux-ok
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - &msys2
        name: Install system deps (Windows)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-libffi
            mingw-w64-ucrt-x86_64-pkgconf

      - &msys2-pkgconfig
        name: Configure pkg-config (Windows)
        shell: msys2 {0}
        run: |
          echo "PKG_CONFIG=$MINGW_PREFIX/bin/pkgconf.exe" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$MINGW_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "$MINGW_PREFIX/bin" >> "$GITHUB_PATH"
          pkgconf --exists libffi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-windows-ucrt-clippy

      - name: Clippy
        shell: msys2 {0}
        run: |
          cargo_bin="$(cygpath -u "${CARGO_HOME:-$USERPROFILE/.cargo}")/bin"
          # /usr/bin: GNU make + cmp for vendored libffi-sys ./configure.
          export PATH="$MINGW_PREFIX/bin:$cargo_bin:/usr/bin:$PATH"
          cargo clippy --workspace --lib --tests --bins -- -D warnings


  # MinGW host matches release-binaries (COI-100/102): MSVC cannot link the
  # MSYS2 libffi package. Keep this on PRs so Unix-only host APIs fail
  # here instead of only on the main-only zip cell.
  #
  # Windows is split three ways (the workspace suite, the two corpus-wide
  # tests, the `.coil` harness), each with its own runner and time limit:
  # in one job they took 37 minutes, most of it the suite and the harness
  # one after the other. All three restore the `test` job's cargo cache;
  # only `test` saves it.
  test-windows-gnu:
    name: test (windows-gnu, default)
    needs: linux-ok
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - *pick-stdlib
      - *checkout-stdlib
      - *msys2
      - *msys2-pkgconfig

      - &rust-windows-gnu
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu

      - &verify-host-triple
        name: Verify host triple
        shell: bash
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          echo "rustc host=$host"
          if [[ "$host" != "x86_64-pc-windows-gnu" ]]; then
            echo "::error::runner host triple '$host' is not x86_64-pc-windows-gnu"
            exit 1
          fi

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-windows-ucrt-default

      - &build-windows-gnu
        name: Build all CLI binaries
        shell: msys2 {0}
        run: |
          cargo_bin="$(cygpath -u "${CARGO_HOME:-$USERPROFILE/.cargo}")/bin"
          # /usr/bin: GNU make + cmp for vendored libffi-sys ./configure.
          export PATH="$MINGW_PREFIX/bin:$cargo_bin:/usr/bin:$PATH"
          rustc -vV
          command -v make
          command -v cmp
          cargo build

      - name: Workspace tests (default)
        shell: msys2 {0}
        run: |
          cargo_bin="$(cygpath -u "${CARGO_HOME:-$USERPROFILE/.cargo}")/bin"
          export PATH="$MINGW_PREFIX/bin:$cargo_bin:/usr/bin:$PATH"
          # shellcheck disable=SC2086 # CORPUS_TESTS_SKIP is a word list
          cargo test --workspace --lib --tests --bins -- $CORPUS_TESTS_SKIP

      - name: Showcase project tests
        shell: msys2 {0}
        run: |
          cargo_bin="$(cygpath -u "${CARGO_HOME:-$USERPROFILE/.cargo}")/bin"
          export PATH="$MINGW_PREFIX/bin:$cargo_bin:/usr/bin:$PATH"
          BIN=./target/debug/coil.exe bash ./examples/projects/run-tests.sh

  test-corpus-windows-gnu:
    name: test corpus (windows-gnu)
    needs: linux-ok
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - *pick-stdlib
      - *checkout-stdlib
      - *msys2
      - *msys2-pkgconfig
      - *rust-windows-gnu
      - *verify-host-triple

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-windows-ucrt-default
          save-if: false

      - name: HIR and coil fmt round trip over the corpus
        shell: msys2 {0}
        run: |
          cargo_bin="$(cygpath -u "${CARGO_HOME:-$USERPROFILE/.cargo}")/bin"
          # /usr/bin: GNU make + cmp for vendored libffi-sys ./configure.
          export PATH="$MINGW_PREFIX/bin:$cargo_bin:/usr/bin:$PATH"
          cargo test -p compiler --test hir_corpus
          cargo test -p parser --test fmt_round_trip

  harness-windows-gnu:
    name: harness default (debug, windows-gnu)
    needs: linux-ok
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - *pick-stdlib
      - *checkout-stdlib
      - *msys2
      - *msys2-pkgconfig
      - *rust-windows-gnu
      - *verify-host-triple

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-windows-ucrt-default
          save-if: false

      - name: Build coil and coil-test
        shell: msys2 {0}
        run: |
          cargo_bin="$(cygpath -u "${CARGO_HOME:-$USERPROFILE/.cargo}")/bin"
          # /usr/bin: GNU make + cmp for vendored libffi-sys ./configure.
          export PATH="$MINGW_PREFIX/bin:$cargo_bin:/usr/bin:$PATH"
          cargo build --bin coil --bin coil-test

      - name: Language harness (`coil test`)
        shell: msys2 {0}
        run: |
          cargo_bin="$(cygpath -u "${CARGO_HOME:-$USERPROFILE/.cargo}")/bin"
          export PATH="$MINGW_PREFIX/bin:$cargo_bin:/usr/bin:$PATH"
          ./target/debug/coil.exe test --allow-read --allow-write --allow-net --allow-env --root examples/src --root .deps/coil-stdlib/src --root ../coil-stdlib/src


  test-macos:
    name: test (${{ matrix.os }})
    needs: linux-ok
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps: *test-steps

  harness-build-macos:
    name: harness build (${{ matrix.mode }}, ${{ matrix.os }})
    needs: linux-ok
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # macOS runners are capped: with `test` this holds three at a time.
      max-parallel: 2
      matrix:
        os: [macos-latest]
        mode: [debug, release, gc-stress]
    steps: *harness-build-steps

  # macOS (aarch64): stack scanning and the frame maps are per target, the
  # compiler settings are not.
  harness-macos:
    name: harness ${{ matrix.variant }} (${{ matrix.mode }}, ${{ matrix.os }})
    needs: harness-build-macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        mode: [debug, release]
        variant: [default, gc-stress]
        exclude:
          - { mode: debug, variant: gc-stress }
    env: *harness-env
    steps: *harness-steps


  # The one check for branch protection to require. Green when Linux is
  # green and either every Windows job is green or, on a draft PR, they were
  # skipped. macOS is left out (see the top of this file).
  ci-ok:
    name: ci ok
    if: always()
    needs:
      - linux-ok
      - clippy-windows-gnu
      - test-windows-gnu
      - test-corpus-windows-gnu
      - harness-windows-gnu
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Linux green, Windows green or skipped on a draft
        env:
          NEEDS: ${{ toJSON(needs) }}
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          if [ "$(echo "$NEEDS" | jq -r '."linux-ok".result')" != success ]; then
            echo "::error::Linux jobs not green"
            exit 1
          fi
          # A draft PR skips Windows; anything else must run it green.
          if [ "$DRAFT" = true ]; then ok='["success","skipped"]'; else ok='["success"]'; fi
          bad=$(echo "$NEEDS" | jq -r --argjson ok "$ok" \
            '[to_entries[] | select(.value.result as $r | $ok | index($r) | not) | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::not green: $bad"
            exit 1
          fi
