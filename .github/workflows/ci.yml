name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CI: "true"

# Prefer `--lib --tests --bins` over `--all-targets`: Criterion benches under
# `[[bench]]` treat argv after `--` as their own CLI and abort the suite.

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.features.id }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        features:
          - id: default
            flags: ""
            mode: test
        include:
          - os: ubuntu-latest
            features:
              id: no-default
              flags: "--no-default-features"
              mode: check
          - os: ubuntu-latest
            features:
              id: dissect
              flags: "--features dissect"
              mode: test
          - os: ubuntu-latest
            features:
              id: debugger
              flags: "--features debugger"
              mode: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-stdlib
          path: .deps/coil-stdlib

      - name: Install system deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev build-essential

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libffi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features.id }}

      - name: Build all CLI binaries
        if: matrix.features.id == 'default'
        run: cargo build

      - name: Workspace check (${{ matrix.features.id }})
        if: matrix.features.mode == 'check'
        run: |
          cargo check --workspace --lib --tests --bins ${{ matrix.features.flags }}

      - name: Workspace tests (${{ matrix.features.id }})
        if: matrix.features.mode == 'test'
        run: |
          # macOS: cargo lists many test binaries in parallel and hits EAGAIN.
          # Raise nofile and serialize package test runs so listing is sequential.
          jobs=""
          extra=""
          if [ "${{ runner.os }}" = "macOS" ]; then
            ulimit -n 65536 || true
            jobs="--jobs 1"
            # Listing ~1500 compiler unit tests otherwise EAGAIN (EMFILE).
            extra="-- --test-threads=1"
            export RUST_TEST_THREADS=1
          fi
          n=0
          until cargo test --workspace --lib --tests --bins $jobs ${{ matrix.features.flags }} $extra; do
            n=$((n + 1))
            if [ "$n" -ge 5 ]; then
              exit 1
            fi
            sleep 5
          done

      - name: Language harness (`coil test`)
        if: matrix.features.id == 'default'
        run: |
          ./target/debug/coil test --root examples/src --root .deps/coil-stdlib/src --root ../coil-stdlib/src

      - name: Leak smoke (`coil test` under ulimit -v)
        if: matrix.features.id == 'default' && runner.os == 'Linux'
        run: |
          ulimit -v 65536
          ./target/debug/coil test --root examples/src --root .deps/coil-stdlib/src --root ../coil-stdlib/src

      - name: Showcase project tests
        if: matrix.features.id == 'default'
        run: |
          BIN=./target/debug/coil ./examples/projects/run-tests.sh

  # MinGW host matches release-binaries (COI-100/102): MSVC cannot link the
  # MSYS2 libffi package. Keep this on PRs so Unix-only host APIs fail
  # here instead of only on the main-only zip cell.
  test-windows-gnu:
    name: test (windows-gnu, default)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-stdlib
          path: .deps/coil-stdlib

      - name: Install system deps (Windows)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-libffi
            mingw-w64-x86_64-pkgconf

      - name: Configure pkg-config (Windows)
        shell: msys2 {0}
        run: |
          echo "PKG_CONFIG=$MINGW_PREFIX/bin/pkgconf.exe" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$MINGW_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "$MINGW_PREFIX/bin" >> "$GITHUB_PATH"
          pkgconf --exists libffi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu

      - name: Verify host triple
        shell: bash
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          echo "rustc host=$host"
          if [[ "$host" != "x86_64-pc-windows-gnu" ]]; then
            echo "::error::runner host triple '$host' is not x86_64-pc-windows-gnu"
            exit 1
          fi

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-windows-gnu-default

      - name: Build all CLI binaries
        shell: msys2 {0}
        run: |
          cargo_bin="$(cygpath -u "${CARGO_HOME:-$USERPROFILE/.cargo}")/bin"
          # /usr/bin: GNU make + cmp for vendored libffi-sys ./configure.
          export PATH="$MINGW_PREFIX/bin:$cargo_bin:/usr/bin:$PATH"
          rustc -vV
          command -v make
          command -v cmp
          cargo build

      - name: Workspace tests (default)
        shell: msys2 {0}
        run: |
          cargo_bin="$(cygpath -u "${CARGO_HOME:-$USERPROFILE/.cargo}")/bin"
          export PATH="$MINGW_PREFIX/bin:$cargo_bin:/usr/bin:$PATH"
          cargo test --workspace --lib --tests --bins --jobs 1

      - name: Language harness (`coil test`)
        shell: msys2 {0}
        run: |
          cargo_bin="$(cygpath -u "${CARGO_HOME:-$USERPROFILE/.cargo}")/bin"
          export PATH="$MINGW_PREFIX/bin:$cargo_bin:/usr/bin:$PATH"
          ./target/debug/coil.exe test --root examples/src --root .deps/coil-stdlib/src --root ../coil-stdlib/src

      - name: Showcase project tests
        shell: msys2 {0}
        run: |
          cargo_bin="$(cygpath -u "${CARGO_HOME:-$USERPROFILE/.cargo}")/bin"
          export PATH="$MINGW_PREFIX/bin:$cargo_bin:/usr/bin:$PATH"
          BIN=./target/debug/coil.exe bash ./examples/projects/run-tests.sh
