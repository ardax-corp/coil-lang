name: CI

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CI: "true"

jobs:
  macos-gc-task-io:
    name: macos gc-stress task_io debug
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-stdlib
          path: .deps/coil-stdlib
      - run: brew install libffi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: harness-variants
      - name: Build plain + gc-stress
        run: |
          cargo build --bin coil --bin coil-test
          cargo build --bin coil --features gc-stress --target-dir target/gc-stress
          cargo build -p coil-test --features gc-stress --target-dir target/gc-stress
      - name: half-close split tests, gc-stress, 10 min each
        if: always()
        timeout-minutes: 50
        run: |
          for k in 0 1 2 3; do
            echo "=== split$k: $(head -n 200 debug-gc/split$k/t.hy | grep -m1 '^test(')"
            start=$(date +%s)
            perl -e 'alarm 600; exec @ARGV' ./target/gc-stress/debug/coil-test -A --root examples/src --root .deps/coil-stdlib/src debug-gc/split$k 2>&1 | grep -E '^>|FAILED|test result|^ok' || true
            echo "exit=${PIPESTATUS[0]} secs=$(( $(date +%s) - start ))"
          done
