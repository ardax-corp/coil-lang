name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request cancels that PR's older runs, so stale runs
# don't fill the runner queue. Pushes to main share one group: the running
# main run always finishes, and a newer push replaces any main run still
# pending, so a burst of merges queues one run, not one per commit. edge.yml
# builds from the newest green main run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `actions: write` lets a failed job cancel the rest of its run.
permissions:
  contents: read
  actions: write

env:
  CARGO_TERM_COLOR: always
  CI: "true"

# Prefer `--lib --tests --bins` over `--all-targets`: Criterion benches under
# `[[bench]]` treat argv after `--` as their own CLI and abort the suite.

jobs:
  # Every crate's default feature set is empty, and `coil-debug` /
  # `coil-dissect` / `coil-test` already turn on `compiler/dissect` and
  # `machine/{debugger,coverage}` for the whole workspace, so one feature set
  # covers `--no-default-features` / `--features dissect|debugger` too.
  # Criterion benches stay out (`--lib --tests --bins`).
  clippy:
    name: clippy (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev build-essential

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: clippy

      - name: Clippy
        run: cargo clippy --workspace --lib --tests --bins -- -D warnings

      # Fail fast on pull requests: a failed job cancels the rest of the run,
      # so a quick fix doesn't wait behind jobs that are already moot.
      - name: Cancel the rest of the run
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  # `cfg(windows)` host code (machine io / fs / reactor / threads) is only
  # linted here.
  clippy-windows-gnu:
    name: clippy (windows-gnu)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Windows)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-libffi
            mingw-w64-x86_64-pkgconf

      - name: Configure pkg-config (Windows)
        shell: msys2 {0}
        run: |
          echo "PKG_CONFIG=$MINGW_PREFIX/bin/pkgconf.exe" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$MINGW_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "$MINGW_PREFIX/bin" >> "$GITHUB_PATH"
          pkgconf --exists libffi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-windows-gnu-clippy

      - name: Clippy
        shell: msys2 {0}
        run: |
          cargo_bin="$(cygpath -u "${CARGO_HOME:-$USERPROFILE/.cargo}")/bin"
          # /usr/bin: GNU make + cmp for vendored libffi-sys ./configure.
          export PATH="$MINGW_PREFIX/bin:$cargo_bin:/usr/bin:$PATH"
          cargo clippy --workspace --lib --tests --bins -- -D warnings

      # Fail fast on pull requests: a failed job cancels the rest of the run,
      # so a quick fix doesn't wait behind jobs that are already moot.
      - name: Cancel the rest of the run
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  # `.hy` sources must be `coil fmt`-clean. `compile_fail/` directories hold
  # deliberately broken programs; `coil fmt` skips them when walking. The embedded prelude
  # (`compiler/src/prelude`) and the comptime fixtures are. A `compile_fail/` test is
  # checked too unless it expects a parse error (E0001, or E0208 for a duplicate field),
  # which `coil fmt` cannot parse either.
  fmt:
    name: coil fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev build-essential

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: fmt

      - name: coil fmt --check
        run: |
          cargo build -p coil-fmt
          ./target/debug/coil-fmt --check examples tests compiler/src/prelude comptime/tests
          # `grep -L` exits 1 when it lists nothing; only coil-fmt's status counts.
          find tests -path '*/compile_fail/*.hy' -print0 \
            | { xargs -0 grep -LZE '^// @expected .*E0(001|208)\b' || true; } \
            | xargs -0 ./target/debug/coil-fmt --check

      # Fail fast on pull requests: a failed job cancels the rest of the run,
      # so a quick fix doesn't wait behind jobs that are already moot.
      - name: Cancel the rest of the run
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-stdlib
          path: .deps/coil-stdlib

      - name: Install system deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev build-essential z3

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libffi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: Build all CLI binaries
        run: cargo build

      - name: Workspace tests
        run: |
          set -euo pipefail
          # macOS: the default nofile limit (256) is low for parallel test runs.
          if [ "${{ runner.os }}" = "macOS" ]; then
            ulimit -n 65536 || true
          fi
          # A FAILED summary with exit 0 must still fail the job.
          log="$(mktemp)"
          set +e
          cargo test --workspace --lib --tests --bins 2>&1 | tee "$log"
          code="${PIPESTATUS[0]}"
          set -e
          if grep -E -q 'test result: FAILED|error: test failed' "$log" && [ "$code" -eq 0 ]; then
            echo "::error::tests reported failure but cargo exited 0" >&2
            exit 1
          fi
          exit "$code"

      - name: Release label lower (COI-407)
        if: runner.os == 'Linux'
        run: |
          # Opt-level 3 / no debug_assertions (the release-compiler panic).
          # Skip fat LTO so this stays a focused label-lower check.
          CARGO_PROFILE_RELEASE_LTO=off CARGO_PROFILE_RELEASE_CODEGEN_UNITS=8 \
          CARGO_PROFILE_RELEASE_PANIC=unwind \
            cargo test --release -p compiler --test coi407_trailing_label -- --exact

      - name: Release compiler lib tests build (#1455)
        if: runner.os == 'Linux'
        run: |
          # Lib tests must compile without debug_assertions (cfg-gated Debug
          # impls in `common`); build only, same profile as the step above.
          CARGO_PROFILE_RELEASE_LTO=off CARGO_PROFILE_RELEASE_CODEGEN_UNITS=8 \
          CARGO_PROFILE_RELEASE_PANIC=unwind \
            cargo test --release -p compiler --lib --no-run

      - name: Release machine lib tests (#1686)
        if: runner.os == 'Linux'
        run: |
          # Same profile as the step above, without debug_assertions; the
          # dev-dependency on `common/debug-fmt` supplies the Debug impls.
          CARGO_PROFILE_RELEASE_LTO=off CARGO_PROFILE_RELEASE_CODEGEN_UNITS=8 \
          CARGO_PROFILE_RELEASE_PANIC=unwind \
            cargo test --release -p machine --lib

      - name: Release VM no_pool park/close (COI-410)
        if: runner.os == 'Linux'
        run: |
          # Opt-level 3 like the release VM, with debug_assertions on and
          # unwind so the harness can compile.
          CARGO_PROFILE_RELEASE_LTO=off \
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS=8 \
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS=true \
          CARGO_PROFILE_RELEASE_PANIC=unwind \
            cargo test --release -p machine --lib \
            vm::tests::no_pool_close_park_resume_two_hundred \
            -- --exact
          CARGO_PROFILE_RELEASE_LTO=off \
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS=8 \
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS=true \
          CARGO_PROFILE_RELEASE_PANIC=unwind \
            cargo test --release -p machine --lib \
            vm::tests::program_string_cache_dropped_when_incremental_sweep_starts \
            -- --exact

      - name: VM-wire suites (pipeline / perf_metrics / namespace / cursor_model)
        if: runner.os == 'Linux'
        run: |
          # `required-features = ["vm-wire"]` keeps these out of the workspace
          # suite. Name them: `--tests` would rerun every compiler test.
          cargo test -p compiler --features vm-wire \
            --test pipeline --test perf_metrics --test namespace --test cursor_model

      - name: Showcase project tests
        run: |
          BIN=./target/debug/coil ./examples/projects/run-tests.sh

      # Fail fast on pull requests: a failed job cancels the rest of the run,
      # so a quick fix doesn't wait behind jobs that are already moot.
      - name: Cancel the rest of the run
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  # The `.hy` harness binaries, built once per OS and build mode (debug and
  # release: the same corpus must pass in both, so a build-mode difference
  # such as an optimizer or overflow-check bug shows up) and cached by
  # rust-cache. Every `harness` cell below downloads them instead of
  # building its own.
  #
  # Linux and macOS are separate jobs so the Linux harness cells start as soon
  # as the Linux builds finish: macOS runners are capped and can queue for a
  # long time, and a `needs:` on one matrix job waits for all of its cells.
  # The macOS jobs reuse the Linux jobs' steps through YAML anchors.
  harness-build:
    name: harness build (${{ matrix.mode }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        mode: [debug, release]
    steps: &harness-build-steps
      - uses: actions/checkout@v4

      - name: Install system deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev build-essential

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libffi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: harness-build-${{ matrix.mode }}
          cache-directories: target/gc-stress

      - name: Build coil and coil-test
        run: cargo build ${{ matrix.mode == 'release' && '--release' || '' }} --bin coil --bin coil-test

      - name: Build coil-test with GC stress
        # `coil test` re-execs `coil-test`; build the harness itself with the feature.
        run: cargo build ${{ matrix.mode == 'release' && '--release' || '' }} -p coil-test --features gc-stress --target-dir target/gc-stress

      - name: Collect binaries
        run: |
          mkdir -p harness-bin/gc-stress
          cp target/${{ matrix.mode }}/coil target/${{ matrix.mode }}/coil-test harness-bin/
          cp target/gc-stress/${{ matrix.mode }}/coil-test harness-bin/gc-stress/

      - uses: actions/upload-artifact@v4
        with:
          name: harness-bin-${{ matrix.os }}-${{ matrix.mode }}
          path: harness-bin
          retention-days: 1

      # Fail fast on pull requests: a failed job cancels the rest of the run,
      # so a quick fix doesn't wait behind jobs that are already moot.
      - name: Cancel the rest of the run
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  # The `.hy` corpora under each compiler / VM setting and build mode, one
  # cell each so debug and release run side by side.
  # `scripts/test_corpora.py` runs each `tests/<corpus>` as its own process,
  # in parallel.
  harness:
    name: harness ${{ matrix.variant }} (${{ matrix.mode }}, ${{ matrix.os }})
    needs: harness-build
    runs-on: ${{ matrix.os }}
    # A hung IO test fails here instead of holding the runner for 6 h (#869).
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        mode: [debug, release]
        variant: [default, O0, no-inline, leak-smoke, gc-stress]
    env: &harness-env
      # A worker abort (coil-lang#804) prints where it happened.
      RUST_BACKTRACE: "1"
      FLAGS: --allow-read --allow-write --allow-net --allow-env --root examples/src --root .deps/coil-stdlib/src --root ../coil-stdlib/src
    steps: &harness-steps
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-stdlib
          path: .deps/coil-stdlib

      - name: Install system deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libffi

      - uses: actions/download-artifact@v4
        with:
          name: harness-bin-${{ matrix.os }}-${{ matrix.mode }}
          path: harness-bin

      - name: Language harness (${{ matrix.variant }}, ${{ matrix.mode }})
        run: |
          chmod +x harness-bin/coil harness-bin/coil-test harness-bin/gc-stress/coil-test
          run="python3 scripts/test_corpora.py --bin harness-bin"
          case "${{ matrix.variant }}" in
            default) $run -- $FLAGS ;;
            # Optimizations hide codegen bugs (LICM materializes invariants,
            # inlining drops CALL targets); run the unoptimized pipeline too.
            O0) $run -- -O 0 $FLAGS ;;
            # Typed inlining is the default; every test must give the same
            # result with it off.
            no-inline) COIL_HIR_INLINE=0 $run -- $FLAGS ;;
            leak-smoke)
              # Each corpus process gets 128 MiB of address space above the
              # harness's own code, and one job: every extra thread reserves
              # a glibc malloc arena (64 MiB of address space), which alone
              # exceeds the room left.
              code_kb=$(( $(size -d harness-bin/coil-test | awk 'NR==2 {print $4}') / 1024 ))
              $run -j 1 --limit-as-kb $(( code_kb + 131072 )) -- $FLAGS ;;
            # Collect and evacuate at every allocation (precise-root soundness).
            # The memory corpus also at -O0: without inlining, a call's
            # result reaches its consumer on the operand stack instead of a
            # local, so the roots differ from the default level (#1481).
            # Generics too: uninlined calls through `forall` parameters
            # pass dictionaries the default level folds away (#1530).
            gc-stress)
              $run --harness harness-bin/gc-stress/coil-test -- $FLAGS
              $run --harness harness-bin/gc-stress/coil-test memory generics -- -O 0 $FLAGS ;;
          esac

      # The examples in the builtin doc stubs (compiler/src/builtin_docs/),
      # which no test file imports. `-A`: they show exec, exit and FFI too.
      - name: Builtin doc-tests (${{ matrix.variant }}, ${{ matrix.mode }})
        if: matrix.variant == 'default' || matrix.variant == 'O0'
        run: |
          harness-bin/coil test --doc-tests-only -A ${{ matrix.variant == 'O0' && '-O 0' || '' }} \
            --root examples/src --root .deps/coil-stdlib/src compiler/src/builtin_docs

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: harness-logs-${{ matrix.os }}-${{ matrix.mode }}-${{ matrix.variant }}
          path: target/corpora
          retention-days: 7

      # Fail fast on pull requests: a failed job cancels the rest of the run,
      # so a quick fix doesn't wait behind jobs that are already moot.
      - name: Cancel the rest of the run
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  harness-build-macos:
    name: harness build (${{ matrix.mode }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        mode: [debug, release]
    steps: *harness-build-steps

  # macOS (aarch64): stack scanning and the frame maps are per target, the
  # compiler settings are not.
  harness-macos:
    name: harness ${{ matrix.variant }} (${{ matrix.mode }}, ${{ matrix.os }})
    needs: harness-build-macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        mode: [debug, release]
        variant: [default, gc-stress]
    env: *harness-env
    steps: *harness-steps

  # MinGW host matches release-binaries (COI-100/102): MSVC cannot link the
  # MSYS2 libffi package. Keep this on PRs so Unix-only host APIs fail
  # here instead of only on the main-only zip cell.
  test-windows-gnu:
    name: test (windows-gnu, default)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-stdlib
          path: .deps/coil-stdlib

      - name: Install system deps (Windows)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-libffi
            mingw-w64-x86_64-pkgconf

      - name: Configure pkg-config (Windows)
        shell: msys2 {0}
        run: |
          echo "PKG_CONFIG=$MINGW_PREFIX/bin/pkgconf.exe" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$MINGW_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "$MINGW_PREFIX/bin" >> "$GITHUB_PATH"
          pkgconf --exists libffi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu

      - name: Verify host triple
        shell: bash
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          echo "rustc host=$host"
          if [[ "$host" != "x86_64-pc-windows-gnu" ]]; then
            echo "::error::runner host triple '$host' is not x86_64-pc-windows-gnu"
            exit 1
          fi

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-windows-gnu-default

      - name: Build all CLI binaries
        shell: msys2 {0}
        run: |
          cargo_bin="$(cygpath -u "${CARGO_HOME:-$USERPROFILE/.cargo}")/bin"
          # /usr/bin: GNU make + cmp for vendored libffi-sys ./configure.
          export PATH="$MINGW_PREFIX/bin:$cargo_bin:/usr/bin:$PATH"
          rustc -vV
          command -v make
          command -v cmp
          cargo build

      - name: Workspace tests (default)
        shell: msys2 {0}
        run: |
          cargo_bin="$(cygpath -u "${CARGO_HOME:-$USERPROFILE/.cargo}")/bin"
          export PATH="$MINGW_PREFIX/bin:$cargo_bin:/usr/bin:$PATH"
          cargo test --workspace --lib --tests --bins --jobs 1

      - name: Language harness (`coil test`)
        shell: msys2 {0}
        run: |
          cargo_bin="$(cygpath -u "${CARGO_HOME:-$USERPROFILE/.cargo}")/bin"
          export PATH="$MINGW_PREFIX/bin:$cargo_bin:/usr/bin:$PATH"
          ./target/debug/coil.exe test --allow-read --allow-write --allow-net --allow-env --root examples/src --root .deps/coil-stdlib/src --root ../coil-stdlib/src

      - name: Showcase project tests
        shell: msys2 {0}
        run: |
          cargo_bin="$(cygpath -u "${CARGO_HOME:-$USERPROFILE/.cargo}")/bin"
          export PATH="$MINGW_PREFIX/bin:$cargo_bin:/usr/bin:$PATH"
          BIN=./target/debug/coil.exe bash ./examples/projects/run-tests.sh

      # Fail fast on pull requests: a failed job cancels the rest of the run,
      # so a quick fix doesn't wait behind jobs that are already moot.
      - name: Cancel the rest of the run
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
