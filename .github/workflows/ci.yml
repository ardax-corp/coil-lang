name: CI

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CI: "true"

jobs:
  macos-gc-task-io:
    name: macos gc-stress task_io debug
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-stdlib
          path: .deps/coil-stdlib
      - run: brew install libffi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: harness-variants
      - name: Build plain + gc-stress
        run: |
          cargo build --bin coil --bin coil-test
          cargo build --bin coil --features gc-stress --target-dir target/gc-stress
          cargo build -p coil-test --features gc-stress --target-dir target/gc-stress
      - name: Diagnostic program, gc-stress
        if: always()
        run: ./target/gc-stress/debug/coil --allow-net --root examples/src --root .deps/coil-stdlib/src debug-gc/task_io_dbg.hy
