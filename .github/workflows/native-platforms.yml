# Probe, not for merging: how far coil gets on the MSVC target. Every stage
# goes on after a failure, so one run shows them all.
name: Native platforms

on:
  pull_request:
    branches: ['feature/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CI: "true"

jobs:
  msvc:
    name: probe (windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-stdlib
          path: .deps/coil-stdlib
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-platforms-msvc
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        shell: pwsh
        run: |
          rustc -vV
          Get-Command link.exe, cl.exe | Format-Table Source
          cargo build -p coil -p coil-embed -p coil-test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build -p coil-rt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem target\debug\coil*.exe, target\debug\coil_rt.lib | Format-Table Name, Length
      - name: JIT, archive and runner
        continue-on-error: true
        shell: bash
        run: bash scripts/native_platform_smoke.sh target/debug .deps/coil-stdlib/src
      - name: AOT by hand with link.exe
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $said = cargo rustc -p coil-rt -- --print native-static-libs 2>&1 | Out-String
          $libs = ([regex]'native-static-libs: (.*)').Match($said).Groups[1].Value.Trim()
          "rustc says: $libs"
          $dir = (Get-ChildItem "$env:USERPROFILE\.cargo\registry\src\*\windows_x86_64_msvc-0.52*\lib" -ErrorAction SilentlyContinue | Select-Object -First 1).DirectoryName
          "import libs: $dir"
          @'
          use io::sync::println;
          use string::format;
          fn fib(int n) -> int {
              if n < 2 {
                  return n;
              }
              return fib(n - 1) + fib(n - 2);
          }
          fn main() {
              let _ = println(format("%i", fib(25)));
          }
          '@ | Set-Content app.coil
          target\debug\coil.exe package --emit obj --root .deps\coil-stdlib\src app.coil -o app.obj
          "package exit: $LASTEXITCODE"
          link.exe /NOLOGO app.obj target\debug\coil_rt.lib @($libs -split '\s+') "/LIBPATH:$dir" /OUT:app.exe /SUBSYSTEM:CONSOLE /OPT:REF /STACK:8388608
          "link exit: $LASTEXITCODE"
          .\app.exe
          "app exit: $LASTEXITCODE"
          if ($LASTEXITCODE) { exit 1 }
      - name: JIT tests
        continue-on-error: true
        shell: pwsh
        run: cargo test -p coil --test native_jit_cli
      - name: Corpus on native code
        continue-on-error: true
        shell: pwsh
        run: |
          target\debug\coil-test.exe --engine native --allow-read --allow-write --allow-net --allow-env --root examples/src --root .deps/coil-stdlib/src tests/functions
          "functions exit: $LASTEXITCODE"
          target\debug\coil-test.exe --engine native --allow-read --allow-write --allow-net --allow-env --root examples/src --root .deps/coil-stdlib/src tests/memory
          "memory exit: $LASTEXITCODE"
