# Probe, not for merging: how far coil gets on the MSVC target. Every stage
# goes on after a failure, so one run shows them all.
name: Native platforms

on:
  pull_request:
    branches: ['feature/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CI: "true"

jobs:
  msvc:
    name: probe (windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-stdlib
          path: .deps/coil-stdlib
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-platforms-msvc
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        shell: pwsh
        run: |
          rustc -vV
          Get-Command link.exe, cl.exe | Format-Table Source
          cargo build -p coil -p coil-embed -p coil-test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build -p coil-rt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem target\debug\coil*.exe, target\debug\coil_rt.lib | Format-Table Name, Length
      - name: The smoke program
        shell: bash
        run: sed -n '/<<.COIL.$/,/^COIL$/p' scripts/native_platform_smoke.sh | sed '1d;$d' > app.coil
      - name: Object
        shell: pwsh
        run: |
          target\debug\coil.exe package --emit obj --root .deps\coil-stdlib\src app.coil -o app.obj
          if ($LASTEXITCODE) { exit 1 }
          target\debug\coil.exe --no-build-cache --root .deps\coil-stdlib\src app.coil
      - name: Link with link.exe, dynamic CRT
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $said = cargo rustc -p coil-rt -- --print native-static-libs 2>&1 | Out-String
          $libs = ([regex]'native-static-libs: (.*)').Match($said).Groups[1].Value.Trim() -split '\s+'
          $found = Get-ChildItem -Path $env:USERPROFILE\.cargo, $env:CARGO_HOME, target -Recurse -Filter 'windows.0.52.0.lib' -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'x86_64_msvc|x86_64-msvc' } | Select-Object -First 1
          "windows.0.52.0.lib: $($found.FullName)"
          $path = @()
          if ($found) { $path = @("/LIBPATH:$($found.DirectoryName)") } else { $libs = $libs | Where-Object { $_ -ne 'windows.0.52.0.lib' } }
          link.exe /NOLOGO app.obj target\debug\coil_rt.lib @libs @path /OUT:app.exe /SUBSYSTEM:CONSOLE /OPT:REF /STACK:8388608
          "link exit: $LASTEXITCODE"
          .\app.exe
          "app exit: $LASTEXITCODE"
          dumpbin /nologo /dependents app.exe | Select-String '\.dll'
          (Get-Item app.exe).Length
      - name: Link with link.exe, static CRT
        continue-on-error: true
        shell: pwsh
        env:
          CARGO_TARGET_DIR: target-static
          RUSTFLAGS: "-C target-feature=+crt-static -C link-arg=/STACK:8388608"
        run: |
          $ErrorActionPreference = 'Continue'
          cargo build -p coil-rt 2>&1 | Select-Object -Last 2
          $said = cargo rustc -p coil-rt -- --print native-static-libs 2>&1 | Out-String
          $libs = ([regex]'native-static-libs: (.*)').Match($said).Groups[1].Value.Trim() -split '\s+'
          "rustc says: $libs"
          $found = Get-ChildItem -Path $env:USERPROFILE\.cargo, $env:CARGO_HOME, target-static -Recurse -Filter 'windows.0.52.0.lib' -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'x86_64_msvc|x86_64-msvc' } | Select-Object -First 1
          $path = @()
          if ($found) { $path = @("/LIBPATH:$($found.DirectoryName)") } else { $libs = $libs | Where-Object { $_ -ne 'windows.0.52.0.lib' } }
          link.exe /NOLOGO app.obj target-static\debug\coil_rt.lib @libs @path /OUT:app-static.exe /SUBSYSTEM:CONSOLE /OPT:REF /STACK:8388608
          "link exit: $LASTEXITCODE"
          .\app-static.exe
          "app exit: $LASTEXITCODE"
          dumpbin /nologo /dependents app-static.exe | Select-String '\.dll'
          (Get-Item app-static.exe).Length
